<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>LEGACY — Tatuajes | Escáner Oficial</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    /* Ocultar por completo el botón blanco VR de A-Frame */
    .a-enter-vr, .a-enter-ar, .a-enter-vr-button {
      display: none !important;
    }

    /* Cabecera superior con logo grande e integrado */
    #top-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 18px 10px 30px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 65%, rgba(0,0,0,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 9999;
      pointer-events: none;
    }
    #top-header img {
      height: 160px; /* Más del doble de grande */
      max-width: 85vw;
      object-fit: contain;
      /* Elimina visualmente el cuadro negro de fondo del logo */
      mix-blend-mode: screen;
      border-radius: 12px;
    }
    .brand-fallback {
      color: #EED9B3;
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: bold;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }
    .brand-sub {
      color: #C5A070;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      margin-top: 4px;
    }

    /* Controles inferiores */
    #ui-container {
      position: fixed;
      bottom: 30px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 9999;
      pointer-events: none;
    }
    .badge {
      background: rgba(8, 8, 8, 0.92);
      color: #EED9B3;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 0.8px;
      border: 1px solid #C5A070;
      text-align: center;
      max-width: 88vw;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8), 0 0 12px rgba(197, 160, 112, 0.25);
    }
    .btn-audio {
      background: linear-gradient(135deg, #EED9B3 0%, #C5A070 50%, #8C6B3F 100%);
      color: #050505;
      border: 1px solid #EED9B3;
      padding: 13px 28px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 4px 15px rgba(197, 160, 112, 0.4);
    }
  </style>
</head>
<body>

  <!-- Encabezado Corporativo Grande -->
  <div id="top-header">
    <img src="./logo-legacy.png" alt="LEGACY" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
    <div id="fallback-title" style="display:none; text-align:center;">
      <div class="brand-fallback">LEGACY</div>
      <div class="brand-sub">✦ TATUAJES ✦</div>
    </div>
  </div>

  <!-- Controles de Estado y Desbloqueo de Audio -->
  <div id="ui-container">
    <div id="status-badge" class="badge">Iniciando cámara y escáner...</div>
    <button id="audio-btn" class="btn-audio">✦ Tocar para Activar Sonido ✦</button>
  </div>

  <audio id="track" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" preload="auto" loop></audio>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target">
      <!-- Destello dorado sobre el tatuaje al reconocerlo -->
      <a-plane color="#C5A070" opacity="0.35" position="0 0 0" height="1" width="1"></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const badge = document.querySelector('#status-badge');
    const audio = document.querySelector('#track');
    const audioBtn = document.querySelector('#audio-btn');

    let audioReady = false;

    audioBtn.addEventListener('click', () => {
      audio.play().then(() => {
        audio.pause();
        audioReady = true;
        audioBtn.style.display = 'none';
        badge.innerText = '✦ Sonido habilitado. Apunta al tatuaje ✦';
      }).catch(err => {
        console.error(err);
      });
    });

    target.addEventListener("targetFound", () => {
      badge.innerText = "✦ Memoria Reconocida — Reproduciendo ✦";
      badge.style.borderColor = "#EED9B3";
      badge.style.color = "#FFFFFF";
      if (audioReady) {
        audio.play();
      }
    });

    target.addEventListener("targetLost", () => {
      badge.innerText = "Enfoca el diseño del tatuaje...";
      badge.style.borderColor = "#C5A070";
      badge.style.color = "#EED9B3";
      audio.pause();
    });

    const scene = document.querySelector('a-scene');
    scene.addEventListener("arReady", () => {
      badge.innerText = "Escáner activo. Enfoca el tatuaje.";
    });
    scene.addEventListener("arError", () => {
      badge.innerText = "Error: Verifica el archivo targets.mind";
      badge.style.borderColor = "#aa3333";
    });
  </script>
</body>
</html>
