<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGACY - Recuerdo Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 16px;
      padding: 30px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #e0e0e0;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 24px;
    }
    audio {
      width: 100%;
      margin: 15px 0;
      outline: none;
    }
    .status {
      font-size: 0.8rem;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>LEGACY</h1>
    <p class="subtitle" id="memory-title">Recuerdo Vinculado</p>

    <!-- Reproductor nativo compatible con iOS y Android -->
    <audio id="audio-player" controls preload="metadata">
      <source src="audio_prueba.mp3" type="audio/mpeg">
      Tu navegador no soporta reproducción de audio.
    </audio>

    <div class="status">ID de verificación: <span id="tag-id">#001</span></div>
  </div>

</body>
</html>
